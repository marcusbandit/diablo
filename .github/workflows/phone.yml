name: phone

on:
  pull_request:
    paths: ["phone/**", "packages/**", "package.json", "bun.lock", ".github/workflows/phone.yml"]
  push:
    branches: [main]
    paths: ["phone/**", "packages/**", "package.json", "bun.lock", ".github/workflows/phone.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: typecheck
        run: bun run --filter diablo-phone typecheck
      - name: tests
        run: bun run --filter diablo-phone test

  debug-apk:
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: bun install --frozen-lockfile
      - name: prebuild and assemble
        working-directory: phone
        run: |
          bunx expo prebuild --platform android --no-install
          cd android && ./gradlew :app:assembleDebug --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: diablo-phone-debug
          path: phone/android/app/build/outputs/apk/debug/*.apk
